<svg width="780" height="360" viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Notification Module ERD</title>
  <desc>Notification, LikeNotification, CommentNotification, FollowNotification, User, Post, Comment 엔티티 관계 다이어그램</desc>

  <defs>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, sans-serif; }
      .th  { font-size: 12px; font-weight: 700; }
      .ts  { font-size: 10.5px; fill: #5F5E5A; }
      .lbl { font-size: 10px;  fill: #888780; }
    </style>
  </defs>

  <rect width="780" height="360" fill="#ffffff"/>

  <!-- ====== NOTIFICATION (abstract base) ====== -->
  <rect x="270" y="20" width="148" height="186" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <rect x="270" y="20" width="148" height="28" rx="8" fill="#CECBF6" stroke="none"/>
  <rect x="270" y="38" width="148" height="10" fill="#CECBF6" stroke="none"/>
  <text class="th" x="344" y="38" text-anchor="middle" dominant-baseline="central" fill="#3C3489">NOTIFICATION</text>
  <text class="ts" x="278" y="53" dominant-baseline="central" fill="#7A74D4" font-style="italic">«abstract / MongoDB»</text>
  <line x1="270" y1="62" x2="418" y2="62" stroke="#534AB7" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="278" y="76"  dominant-baseline="central">id (PK, ObjectId)</text>
  <text class="ts" x="278" y="93"  dominant-baseline="central">userId (FK)</text>
  <text class="ts" x="278" y="110" dominant-baseline="central">type (LIKE/COMMENT/FOLLOW)</text>
  <text class="ts" x="278" y="127" dominant-baseline="central">occurredAt</text>
  <text class="ts" x="278" y="144" dominant-baseline="central">createdAt</text>
  <text class="ts" x="278" y="161" dominant-baseline="central">lastUpdatedAt</text>
  <text class="ts" x="278" y="178" dominant-baseline="central">deletedAt (TTL)</text>

  <!-- ====== LIKE_NOTIFICATION ====== -->
  <rect x="20" y="240" width="148" height="96" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
  <rect x="20" y="240" width="148" height="28" rx="8" fill="#9FE1CB" stroke="none"/>
  <rect x="20" y="258" width="148" height="10" fill="#9FE1CB" stroke="none"/>
  <text class="th" x="94" y="258" text-anchor="middle" dominant-baseline="central" fill="#085041">LIKE_NOTIFICATION</text>
  <line x1="20" y1="268" x2="168" y2="268" stroke="#1D9E75" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="30" y="283" dominant-baseline="central">postId (FK)</text>
  <text class="ts" x="30" y="300" dominant-baseline="central">likerIds (List)</text>
  <text class="ts" x="30" y="317" dominant-baseline="central">+addLiker / removeLiker</text>

  <!-- ====== COMMENT_NOTIFICATION ====== -->
  <rect x="196" y="240" width="148" height="96" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
  <rect x="196" y="240" width="148" height="28" rx="8" fill="#9FE1CB" stroke="none"/>
  <rect x="196" y="258" width="148" height="10" fill="#9FE1CB" stroke="none"/>
  <text class="th" x="270" y="258" text-anchor="middle" dominant-baseline="central" fill="#085041">COMMENT_NOTIFICATION</text>
  <line x1="196" y1="268" x2="344" y2="268" stroke="#1D9E75" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="206" y="283" dominant-baseline="central">postId (FK)</text>
  <text class="ts" x="206" y="300" dominant-baseline="central">writerId (FK)</text>
  <text class="ts" x="206" y="317" dominant-baseline="central">commentId / comment</text>

  <!-- ====== FOLLOW_NOTIFICATION ====== -->
  <rect x="372" y="240" width="148" height="78" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
  <rect x="372" y="240" width="148" height="28" rx="8" fill="#9FE1CB" stroke="none"/>
  <rect x="372" y="258" width="148" height="10" fill="#9FE1CB" stroke="none"/>
  <text class="th" x="446" y="258" text-anchor="middle" dominant-baseline="central" fill="#085041">FOLLOW_NOTIFICATION</text>
  <line x1="372" y1="268" x2="520" y2="268" stroke="#1D9E75" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="382" y="283" dominant-baseline="central">followerId (FK)</text>
  <text class="ts" x="382" y="300" dominant-baseline="central">—</text>

  <!-- ====== USER ====== -->
  <rect x="560" y="20" width="120" height="96" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
  <rect x="560" y="20" width="120" height="28" rx="8" fill="#D3D1C7" stroke="none"/>
  <rect x="560" y="38" width="120" height="10" fill="#D3D1C7" stroke="none"/>
  <text class="th" x="620" y="38" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">USER</text>
  <line x1="560" y1="48" x2="680" y2="48" stroke="#888780" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="570" y="63"  dominant-baseline="central">id (PK)</text>
  <text class="ts" x="570" y="80"  dominant-baseline="central">name</text>
  <text class="ts" x="570" y="97"  dominant-baseline="central">profileImageUrl</text>

  <!-- ====== POST ====== -->
  <rect x="560" y="140" width="120" height="96" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
  <rect x="560" y="140" width="120" height="28" rx="8" fill="#D3D1C7" stroke="none"/>
  <rect x="560" y="158" width="120" height="10" fill="#D3D1C7" stroke="none"/>
  <text class="th" x="620" y="158" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">POST</text>
  <line x1="560" y1="168" x2="680" y2="168" stroke="#888780" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="570" y="183" dominant-baseline="central">id (PK)</text>
  <text class="ts" x="570" y="200" dominant-baseline="central">userId (FK)</text>
  <text class="ts" x="570" y="217" dominant-baseline="central">imageUrl / content</text>

  <!-- ====== COMMENT ====== -->
  <rect x="560" y="260" width="120" height="78" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
  <rect x="560" y="260" width="120" height="28" rx="8" fill="#D3D1C7" stroke="none"/>
  <rect x="560" y="278" width="120" height="10" fill="#D3D1C7" stroke="none"/>
  <text class="th" x="620" y="278" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">COMMENT</text>
  <line x1="560" y1="288" x2="680" y2="288" stroke="#888780" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="570" y="303" dominant-baseline="central">id (PK)</text>
  <text class="ts" x="570" y="320" dominant-baseline="central">userId / content</text>

  <!-- ====== Inheritance: NOTIFICATION → subclasses ====== -->
  <path d="M344 206 L344 222 L94 222 L94 239" fill="none" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="5,3" marker-end="url(#arrow-p)"/>
  <text class="lbl" x="200" y="218" dominant-baseline="central">extends</text>
  <line x1="344" y1="206" x2="270" y2="239" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="5,3" marker-end="url(#arrow-p)"/>
  <path d="M344 206 L344 222 L446 222 L446 239" fill="none" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="5,3" marker-end="url(#arrow-p)"/>

  <!-- ====== NOTIFICATION → USER (수신자) ====== -->
  <line x1="418" y1="110" x2="559" y2="60" stroke="#888780" stroke-width="0.6" marker-end="url(#arrow-g)"/>
  <text class="lbl" x="476" y="77" dominant-baseline="central">수신자</text>

  <!-- ====== LIKE_NOTIFICATION → POST ====== -->
  <path d="M168 270 L540 270 L540 188 L559 188" fill="none" stroke="#1D9E75" stroke-width="0.6" marker-end="url(#arrow-t)"/>
  <text class="lbl" x="350" y="264" dominant-baseline="central">참조</text>

  <!-- ====== COMMENT_NOTIFICATION → POST ====== -->
  <path d="M344 275 L540 275 L540 188 L559 188" fill="none" stroke="#1D9E75" stroke-width="0.6" marker-end="url(#arrow-t)"/>

  <!-- ====== COMMENT_NOTIFICATION → COMMENT ====== -->
  <path d="M344 310 L540 310 L540 299 L559 299" fill="none" stroke="#1D9E75" stroke-width="0.6" marker-end="url(#arrow-t)"/>
  <text class="lbl" x="430" y="304" dominant-baseline="central">참조</text>

  <!-- ====== FOLLOW_NOTIFICATION → USER (follower) ====== -->
  <path d="M520 270 L545 270 L545 80 L559 80" fill="none" stroke="#1D9E75" stroke-width="0.6" marker-end="url(#arrow-t)"/>
  <text class="lbl" x="530" y="170" dominant-baseline="central">팔로워</text>

  <!-- ====== USER → POST ====== -->
  <line x1="620" y1="116" x2="620" y2="139" stroke="#888780" stroke-width="0.6" marker-end="url(#arrow-g)"/>
  <text class="lbl" x="626" y="130" dominant-baseline="central">작성</text>

  <!-- ====== Legend ====== -->
  <rect x="20" y="332" width="10" height="10" rx="2" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text class="ts" x="34" y="337" dominant-baseline="central">추상 엔티티</text>
  <rect x="130" y="332" width="10" height="10" rx="2" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="ts" x="144" y="337" dominant-baseline="central">알림 서브타입</text>
  <rect x="255" y="332" width="10" height="10" rx="2" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
  <text class="ts" x="269" y="337" dominant-baseline="central">참조 도메인</text>
  <line x1="360" y1="337" x2="385" y2="337" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="5,3"/>
  <text class="ts" x="390" y="337" dominant-baseline="central">상속</text>
  <line x1="430" y1="337" x2="455" y2="337" stroke="#1D9E75" stroke-width="0.8"/>
  <text class="ts" x="460" y="337" dominant-baseline="central">참조/연관</text>
</svg>
