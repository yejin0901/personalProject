<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Live module ERD</title>
  <desc>USER, CHANNEL, VIDEO, COMMENT, VIDEO_RATE, COMMENT_RATE 6개 엔티티의 관계 다이어그램</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, sans-serif; }
      .th { font-size: 13px; font-weight: 600; fill: #3C3489; }
      .ts { font-size: 11px; font-weight: 400; fill: #5F5E5A; }
      .divider { stroke: #534AB7; stroke-width: 0.5; opacity: 0.4; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="680" height="340" fill="#ffffff"/>

  <!-- ===== USER ===== -->
  <rect x="20" y="95" width="112" height="136" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <rect x="20" y="95" width="112" height="26" rx="8" fill="#CECBF6" stroke="none"/>
  <rect x="20" y="113" width="112" height="8" fill="#CECBF6" stroke="none"/>
  <text class="th" x="76" y="113" text-anchor="middle" dominant-baseline="central">USER</text>
  <line x1="20" y1="121" x2="132" y2="121" class="divider"/>
  <text class="ts" x="30" y="137" dominant-baseline="central">id (PK)</text>
  <text class="ts" x="30" y="155" dominant-baseline="central">name</text>
  <text class="ts" x="30" y="173" dominant-baseline="central">profileImageUrl</text>
  <text class="ts" x="30" y="191" dominant-baseline="central">—</text>

  <!-- ===== CHANNEL ===== -->
  <rect x="162" y="55" width="126" height="156" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <rect x="162" y="55" width="126" height="26" rx="8" fill="#CECBF6" stroke="none"/>
  <rect x="162" y="73" width="126" height="8" fill="#CECBF6" stroke="none"/>
  <text class="th" x="225" y="73" text-anchor="middle" dominant-baseline="central">CHANNEL</text>
  <line x1="162" y1="81" x2="288" y2="81" class="divider"/>
  <text class="ts" x="172" y="97" dominant-baseline="central">id (PK)</text>
  <text class="ts" x="172" y="115" dominant-baseline="central">contentOwnerId (FK)</text>
  <text class="ts" x="172" y="133" dominant-baseline="central">title</text>
  <text class="ts" x="172" y="151" dominant-baseline="central">subscriberCount</text>
  <text class="ts" x="172" y="169" dominant-baseline="central">videoCount</text>
  <text class="ts" x="172" y="187" dominant-baseline="central">commentCount</text>

  <!-- ===== VIDEO ===== -->
  <rect x="318" y="15" width="116" height="176" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <rect x="318" y="15" width="116" height="26" rx="8" fill="#9FE1CB" stroke="none"/>
  <rect x="318" y="33" width="116" height="8" fill="#9FE1CB" stroke="none"/>
  <text class="th" x="376" y="33" text-anchor="middle" dominant-baseline="central" fill="#085041">VIDEO</text>
  <line x1="318" y1="41" x2="434" y2="41" stroke="#1D9E75" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="328" y="57" dominant-baseline="central">id (PK)</text>
  <text class="ts" x="328" y="75" dominant-baseline="central">channelId (FK)</text>
  <text class="ts" x="328" y="93" dominant-baseline="central">title</text>
  <text class="ts" x="328" y="111" dominant-baseline="central">fileUrl</text>
  <text class="ts" x="328" y="129" dominant-baseline="central">viewCount</text>
  <text class="ts" x="328" y="147" dominant-baseline="central">likeCount</text>
  <text class="ts" x="328" y="165" dominant-baseline="central">publishedAt</text>

  <!-- ===== COMMENT ===== -->
  <rect x="318" y="205" width="116" height="116" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <rect x="318" y="205" width="116" height="26" rx="8" fill="#9FE1CB" stroke="none"/>
  <rect x="318" y="223" width="116" height="8" fill="#9FE1CB" stroke="none"/>
  <text class="th" x="376" y="223" text-anchor="middle" dominant-baseline="central" fill="#085041">COMMENT</text>
  <line x1="318" y1="231" x2="434" y2="231" stroke="#1D9E75" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="328" y="247" dominant-baseline="central">id (PK)</text>
  <text class="ts" x="328" y="265" dominant-baseline="central">videoId (FK)</text>
  <text class="ts" x="328" y="283" dominant-baseline="central">authorId (FK)</text>
  <text class="ts" x="328" y="301" dominant-baseline="central">parentId / text</text>

  <!-- ===== VIDEO_RATE ===== -->
  <rect x="464" y="15" width="116" height="96" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <rect x="464" y="15" width="116" height="26" rx="8" fill="#D3D1C7" stroke="none"/>
  <rect x="464" y="33" width="116" height="8" fill="#D3D1C7" stroke="none"/>
  <text class="th" x="522" y="33" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">VIDEO_RATE</text>
  <line x1="464" y1="41" x2="580" y2="41" stroke="#888780" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="474" y="57" dominant-baseline="central">videoId (FK)</text>
  <text class="ts" x="474" y="75" dominant-baseline="central">userId (FK)</text>
  <text class="ts" x="474" y="93" dominant-baseline="central">rate (like/none)</text>

  <!-- ===== COMMENT_RATE ===== -->
  <rect x="464" y="205" width="116" height="96" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <rect x="464" y="205" width="116" height="26" rx="8" fill="#D3D1C7" stroke="none"/>
  <rect x="464" y="223" width="116" height="8" fill="#D3D1C7" stroke="none"/>
  <text class="th" x="522" y="223" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">COMMENT_RATE</text>
  <line x1="464" y1="231" x2="580" y2="231" stroke="#888780" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="474" y="247" dominant-baseline="central">commentId (FK)</text>
  <text class="ts" x="474" y="265" dominant-baseline="central">userId (FK)</text>
  <text class="ts" x="474" y="283" dominant-baseline="central">rate (like/none)</text>

  <!-- ===== Relations ===== -->
  <!-- USER → CHANNEL : 소유 -->
  <line x1="132" y1="138" x2="161" y2="125" stroke="#534AB7" stroke-width="0.5" marker-end="url(#arrow)"/>
  <text class="ts" x="148" y="126" text-anchor="middle" dominant-baseline="central">소유</text>

  <!-- USER → COMMENT : 작성 -->
  <path d="M132 175 L150 175 L150 263 L317 263" fill="none" stroke="#534AB7" stroke-width="0.5" marker-end="url(#arrow)"/>
  <text class="ts" x="214" y="256" text-anchor="middle" dominant-baseline="central">작성</text>

  <!-- USER → VIDEO_RATE : 평가 -->
  <path d="M132 110 L150 110 L150 48 L463 48" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow-gray)"/>
  <text class="ts" x="306" y="41" text-anchor="middle" dominant-baseline="central">평가</text>

  <!-- USER → COMMENT_RATE : 평가 -->
  <path d="M76 231 L76 253 L454 253 L454 263 L463 263" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow-gray)"/>
  <text class="ts" x="270" y="246" text-anchor="middle" dominant-baseline="central">평가</text>

  <!-- CHANNEL → VIDEO : 보유 -->
  <line x1="288" y1="105" x2="317" y2="95" stroke="#1D9E75" stroke-width="0.5" marker-end="url(#arrow-teal)"/>
  <text class="ts" x="304" y="93" text-anchor="middle" dominant-baseline="central">보유</text>

  <!-- CHANNEL → COMMENT : 포함 -->
  <path d="M288 175 L305 175 L305 263 L317 263" fill="none" stroke="#1D9E75" stroke-width="0.5" marker-end="url(#arrow-teal)"/>
  <text class="ts" x="300" y="213" text-anchor="middle" dominant-baseline="central">포함</text>

  <!-- VIDEO → COMMENT : 포함 -->
  <line x1="376" y1="191" x2="376" y2="204" stroke="#1D9E75" stroke-width="0.5" marker-end="url(#arrow-teal)"/>
  <text class="ts" x="388" y="198" dominant-baseline="central">포함</text>

  <!-- VIDEO → VIDEO_RATE : 집계 -->
  <line x1="434" y1="75" x2="463" y2="65" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow-gray)"/>
  <text class="ts" x="450" y="62" text-anchor="middle" dominant-baseline="central">집계</text>

  <!-- COMMENT → COMMENT_RATE : 집계 -->
  <line x1="434" y1="255" x2="463" y2="255" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow-gray)"/>
  <text class="ts" x="450" y="247" text-anchor="middle" dominant-baseline="central">집계</text>

  <!-- COMMENT self-ref : 대댓글 -->
  <path d="M434 220 L452 220 L452 208 L435 208" fill="none" stroke="#1D9E75" stroke-width="0.5" marker-end="url(#arrow-teal)"/>
  <text class="ts" x="454" y="200" dominant-baseline="central">대댓글</text>

  <!-- ===== Legend ===== -->
  <rect x="20" y="308" width="10" height="10" rx="2" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text class="ts" x="34" y="313" dominant-baseline="central">핵심 엔티티</text>
  <rect x="115" y="308" width="10" height="10" rx="2" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="ts" x="129" y="313" dominant-baseline="central">콘텐츠</text>
  <rect x="185" y="308" width="10" height="10" rx="2" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
  <text class="ts" x="199" y="313" dominant-baseline="central">평가</text>
</svg>
