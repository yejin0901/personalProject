<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Batch Module ERD</title>
  <desc>orders, order_items, payment, products 원천 테이블과 brand_reports, category_reports, manufacturer_reports, product_status_reports, transaction_reports 배치 리포트 테이블 관계 다이어그램</desc>

  <defs>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C47A00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, sans-serif; }
      .th  { font-size: 12px; font-weight: 700; }
      .ts  { font-size: 10.5px; fill: #5F5E5A; }
      .te  { font-size: 9.5px; font-style: italic; }
      .lbl { font-size: 10px; fill: #888780; }
      .grp { font-size: 10px; font-weight: 700; fill: #888780; letter-spacing: 0.04em; }
    </style>
  </defs>

  <rect width="900" height="420" fill="#ffffff"/>

  <!-- ── Group label: 원천 데이터 ── -->
  <text class="grp" x="20" y="18" dominant-baseline="central">■ 원천 데이터 (Spring Batch Reader)</text>
  <line x1="20" y1="24" x2="430" y2="24" stroke="#d0cecc" stroke-width="0.7"/>

  <!-- ── Group label: 배치 리포트 ── -->
  <text class="grp" x="470" y="18" dominant-baseline="central">■ 배치 리포트 (Spring Batch Writer)</text>
  <line x1="470" y1="24" x2="885" y2="24" stroke="#d0cecc" stroke-width="0.7"/>

  <!-- ===================== orders ===================== -->
  <rect x="20" y="32" width="148" height="172" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <rect x="20" y="32" width="148" height="26" rx="8" fill="#CECBF6" stroke="none"/>
  <rect x="20" y="48"  width="148" height="10" fill="#CECBF6" stroke="none"/>
  <text class="th" x="94" y="49" text-anchor="middle" dominant-baseline="central" fill="#3C3489">orders</text>
  <text class="te" x="94" y="64" text-anchor="middle" dominant-baseline="central" fill="#7A74D4">Order.java · @Table</text>
  <line x1="20" y1="70" x2="168" y2="70" stroke="#534AB7" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="30" y="84"  dominant-baseline="central">orderId (PK, IDENTITY)</text>
  <text class="ts" x="30" y="101" dominant-baseline="central">customerId</text>
  <text class="ts" x="30" y="118" dominant-baseline="central">orderDate</text>
  <text class="ts" x="30" y="135" dominant-baseline="central">orderStatus</text>
  <!-- enum badge -->
  <rect x="30" y="144" width="128" height="52" rx="4" fill="#F3F2FD" stroke="#534AB7" stroke-width="0.4"/>
  <text class="te" x="94" y="155" text-anchor="middle" dominant-baseline="central" fill="#534AB7">PENDING_PAYMENT</text>
  <text class="te" x="94" y="169" text-anchor="middle" dominant-baseline="central" fill="#534AB7">PROCESSING · COMPLETED</text>
  <text class="te" x="94" y="183" text-anchor="middle" dominant-baseline="central" fill="#534AB7">CANCELLED</text>

  <!-- ===================== order_items ===================== -->
  <rect x="20" y="218" width="148" height="128" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <rect x="20" y="218" width="148" height="26" rx="8" fill="#CECBF6" stroke="none"/>
  <rect x="20" y="234" width="148" height="10" fill="#CECBF6" stroke="none"/>
  <text class="th" x="94" y="235" text-anchor="middle" dominant-baseline="central" fill="#3C3489">order_items</text>
  <text class="te" x="94" y="250" text-anchor="middle" dominant-baseline="central" fill="#7A74D4">OrderItem.java · @Table</text>
  <line x1="20" y1="256" x2="168" y2="256" stroke="#534AB7" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="30" y="271" dominant-baseline="central">orderItemId (PK)</text>
  <text class="ts" x="30" y="288" dominant-baseline="central">order_id (FK)</text>
  <text class="ts" x="30" y="305" dominant-baseline="central">productId</text>
  <text class="ts" x="30" y="322" dominant-baseline="central">quantity · unitPrice</text>

  <!-- ===================== payment ===================== -->
  <rect x="196" y="32" width="152" height="196" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
  <rect x="196" y="32" width="152" height="26" rx="8" fill="#9FE1CB" stroke="none"/>
  <rect x="196" y="48"  width="152" height="10" fill="#9FE1CB" stroke="none"/>
  <text class="th" x="272" y="49" text-anchor="middle" dominant-baseline="central" fill="#085041">payment</text>
  <text class="te" x="272" y="64" text-anchor="middle" dominant-baseline="central" fill="#1D9E75">Payment.java · @Table</text>
  <line x1="196" y1="70" x2="348" y2="70" stroke="#1D9E75" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="206" y="84"  dominant-baseline="central">paymentId (PK)</text>
  <text class="ts" x="206" y="101" dominant-baseline="central">order_id (FK, 1:1)</text>
  <text class="ts" x="206" y="118" dominant-baseline="central">paymentMethod</text>
  <text class="ts" x="206" y="135" dominant-baseline="central">paymentStatus</text>
  <text class="ts" x="206" y="152" dominant-baseline="central">paymentDate</text>
  <text class="ts" x="206" y="169" dominant-baseline="central">amount</text>
  <!-- enum badge -->
  <rect x="206" y="178" width="132" height="42" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.4"/>
  <text class="te" x="272" y="189" text-anchor="middle" dominant-baseline="central" fill="#1D9E75">PENDING · COMPLETED · FAILED</text>
  <text class="te" x="272" y="203" text-anchor="middle" dominant-baseline="central" fill="#1D9E75">CANCELLED · REFUNDED</text>

  <!-- ===================== products ===================== -->
  <rect x="196" y="248" width="152" height="162" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
  <rect x="196" y="248" width="152" height="26" rx="8" fill="#9FE1CB" stroke="none"/>
  <rect x="196" y="264" width="152" height="10" fill="#9FE1CB" stroke="none"/>
  <text class="th" x="272" y="265" text-anchor="middle" dominant-baseline="central" fill="#085041">products</text>
  <text class="te" x="272" y="281" text-anchor="middle" dominant-baseline="central" fill="#1D9E75">Product.java · @Table</text>
  <line x1="196" y1="288" x2="348" y2="288" stroke="#1D9E75" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="206" y="302" dominant-baseline="central">productId (PK, String)</text>
  <text class="ts" x="206" y="319" dominant-baseline="central">sellerId · category</text>
  <text class="ts" x="206" y="336" dominant-baseline="central">brand · manufacturer</text>
  <text class="ts" x="206" y="353" dominant-baseline="central">salesPrice · stockQuantity</text>
  <text class="ts" x="206" y="370" dominant-baseline="central">productStatus · salesDate</text>
  <!-- enum badge -->
  <rect x="206" y="378" width="132" height="24" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.4"/>
  <text class="te" x="272" y="390" text-anchor="middle" dominant-baseline="central" fill="#1D9E75">AVAILABLE · OUT_OF_STOCK · DISCONTINUED</text>

  <!-- ===================== brand_reports ===================== -->
  <rect x="470" y="32" width="162" height="145" rx="8" fill="#FFF3DC" stroke="#C47A00" stroke-width="0.8"/>
  <rect x="470" y="32" width="162" height="26" rx="8" fill="#FFE0A0" stroke="none"/>
  <rect x="470" y="48"  width="162" height="10" fill="#FFE0A0" stroke="none"/>
  <text class="th" x="551" y="49" text-anchor="middle" dominant-baseline="central" fill="#7A4800">brand_reports</text>
  <text class="te" x="551" y="64" text-anchor="middle" dominant-baseline="central" fill="#C47A00">BrandReport · @IdClass(BrandReportId)</text>
  <line x1="470" y1="70" x2="632" y2="70" stroke="#C47A00" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="480" y="84"  dominant-baseline="central">statDate (PK)</text>
  <text class="ts" x="480" y="101" dominant-baseline="central">brand (PK)</text>
  <text class="ts" x="480" y="118" dominant-baseline="central">productCount · avgSalesPrice</text>
  <text class="ts" x="480" y="135" dominant-baseline="central">max/minSalesPrice</text>
  <text class="ts" x="480" y="152" dominant-baseline="central">totalStockQuantity · totalStockValue</text>

  <!-- ===================== category_reports ===================== -->
  <rect x="470" y="190" width="162" height="128" rx="8" fill="#FFF3DC" stroke="#C47A00" stroke-width="0.8"/>
  <rect x="470" y="190" width="162" height="26" rx="8" fill="#FFE0A0" stroke="none"/>
  <rect x="470" y="206" width="162" height="10" fill="#FFE0A0" stroke="none"/>
  <text class="th" x="551" y="207" text-anchor="middle" dominant-baseline="central" fill="#7A4800">category_reports</text>
  <text class="te" x="551" y="222" text-anchor="middle" dominant-baseline="central" fill="#C47A00">CategoryReport · @IdClass</text>
  <line x1="470" y1="228" x2="632" y2="228" stroke="#C47A00" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="480" y="242" dominant-baseline="central">statDate (PK)</text>
  <text class="ts" x="480" y="259" dominant-baseline="central">category (PK)</text>
  <text class="ts" x="480" y="276" dominant-baseline="central">productCount · avgSalesPrice</text>
  <text class="ts" x="480" y="293" dominant-baseline="central">totalStockQuantity · potentialSalesAmount</text>

  <!-- ===================== manufacturer_reports ===================== -->
  <rect x="470" y="332" width="162" height="78" rx="8" fill="#FFF3DC" stroke="#C47A00" stroke-width="0.8"/>
  <rect x="470" y="332" width="162" height="26" rx="8" fill="#FFE0A0" stroke="none"/>
  <rect x="470" y="348" width="162" height="10" fill="#FFE0A0" stroke="none"/>
  <text class="th" x="551" y="349" text-anchor="middle" dominant-baseline="central" fill="#7A4800">manufacturer_reports</text>
  <text class="te" x="551" y="364" text-anchor="middle" dominant-baseline="central" fill="#C47A00">ManufacturerReport · @IdClass</text>
  <line x1="470" y1="370" x2="632" y2="370" stroke="#C47A00" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="480" y="385" dominant-baseline="central">statDate (PK) · manufacturer (PK)</text>
  <text class="ts" x="480" y="402" dominant-baseline="central">productCount · avgSalesPrice · totalStock</text>

  <!-- ===================== product_status_reports ===================== -->
  <rect x="658" y="32" width="162" height="110" rx="8" fill="#FFF3DC" stroke="#C47A00" stroke-width="0.8"/>
  <rect x="658" y="32" width="162" height="26" rx="8" fill="#FFE0A0" stroke="none"/>
  <rect x="658" y="48"  width="162" height="10" fill="#FFE0A0" stroke="none"/>
  <text class="th" x="739" y="49" text-anchor="middle" dominant-baseline="central" fill="#7A4800">product_status_reports</text>
  <text class="te" x="739" y="64" text-anchor="middle" dominant-baseline="central" fill="#C47A00">ProductStatusReport · @IdClass</text>
  <line x1="658" y1="70" x2="820" y2="70" stroke="#C47A00" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="668" y="84"  dominant-baseline="central">statDate (PK)</text>
  <text class="ts" x="668" y="101" dominant-baseline="central">productStatus (PK)</text>
  <text class="ts" x="668" y="118" dominant-baseline="central">productCount · avgStockQuantity</text>

  <!-- ===================== transaction_reports ===================== -->
  <rect x="658" y="158" width="162" height="162" rx="8" fill="#FFF3DC" stroke="#C47A00" stroke-width="0.8"/>
  <rect x="658" y="158" width="162" height="26" rx="8" fill="#FFE0A0" stroke="none"/>
  <rect x="658" y="174" width="162" height="10" fill="#FFE0A0" stroke="none"/>
  <text class="th" x="739" y="175" text-anchor="middle" dominant-baseline="central" fill="#7A4800">transaction_reports</text>
  <text class="te" x="739" y="190" text-anchor="middle" dominant-baseline="central" fill="#C47A00">TransactionReport · @IdClass</text>
  <line x1="658" y1="196" x2="820" y2="196" stroke="#C47A00" stroke-width="0.5" opacity="0.4"/>
  <text class="ts" x="668" y="210" dominant-baseline="central">transactionDate (PK)</text>
  <text class="ts" x="668" y="227" dominant-baseline="central">transactionType (PK)</text>
  <text class="ts" x="668" y="244" dominant-baseline="central">transactionCount · totalAmount</text>
  <text class="ts" x="668" y="261" dominant-baseline="central">customerCount · orderCount</text>
  <text class="ts" x="668" y="278" dominant-baseline="central">paymentMethodCount</text>
  <text class="ts" x="668" y="295" dominant-baseline="central">avgProductCount · totalItemQuantity</text>
  <!-- enum badge -->
  <rect x="668" y="304" width="142" height="12" rx="3" fill="#FFF3DC"/>
  <text class="te" x="739" y="310" text-anchor="middle" dominant-baseline="central" fill="#C47A00">ORDER_CREATION · PAYMENT_COMPLETION · ORDER_COMPLETION · ORDER_CANCELLATION</text>

  <!-- ===================== Relations ===================== -->

  <!-- orders 1 → N order_items -->
  <line x1="94" y1="204" x2="94" y2="217" stroke="#534AB7" stroke-width="0.8" marker-end="url(#arr-p)"/>
  <text class="lbl" x="100" y="212" dominant-baseline="central">1:N</text>

  <!-- orders 1:1 payment -->
  <line x1="168" y1="100" x2="195" y2="100" stroke="#1D9E75" stroke-width="0.8" marker-end="url(#arr-t)"/>
  <text class="lbl" x="174" y="93" dominant-baseline="central">1:1</text>

  <!-- Batch 화살표: products → brand/category/manufacturer/status reports -->
  <!-- 세로 중간 배치 기준선 -->
  <path d="M348 320 L440 320 L440 105 L469 105" fill="none" stroke="#C47A00" stroke-width="0.8" stroke-dasharray="5,3" marker-end="url(#arr-o)"/>
  <text class="lbl" x="385" y="312" text-anchor="middle" dominant-baseline="central">집계</text>

  <path d="M348 320 L440 320 L440 253 L469 253" fill="none" stroke="#C47A00" stroke-width="0.8" stroke-dasharray="5,3" marker-end="url(#arr-o)"/>
  <path d="M348 320 L440 320 L440 371 L469 371" fill="none" stroke="#C47A00" stroke-width="0.8" stroke-dasharray="5,3" marker-end="url(#arr-o)"/>
  <path d="M348 320 L440 320 L440 85 L657 85" fill="none" stroke="#C47A00" stroke-width="0.8" stroke-dasharray="5,3" marker-end="url(#arr-o)"/>

  <!-- orders + order_items + payment → transaction_reports -->
  <path d="M168 150 L450 150 L450 238 L657 238" fill="none" stroke="#C47A00" stroke-width="0.8" stroke-dasharray="5,3" marker-end="url(#arr-o)"/>
  <text class="lbl" x="410" y="143" text-anchor="middle" dominant-baseline="central">집계</text>

  <!-- ===================== Legend ===================== -->
  <rect x="20" y="396" width="10" height="10" rx="2" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text class="ts" x="34" y="401" dominant-baseline="central">주문</text>
  <rect x="80" y="396" width="10" height="10" rx="2" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="ts" x="94" y="401" dominant-baseline="central">결제/상품</text>
  <rect x="160" y="396" width="10" height="10" rx="2" fill="#FFE0A0" stroke="#C47A00" stroke-width="0.5"/>
  <text class="ts" x="174" y="401" dominant-baseline="central">배치 리포트 (복합PK)</text>
  <line x1="300" y1="401" x2="322" y2="401" stroke="#C47A00" stroke-width="0.8" stroke-dasharray="5,3"/>
  <text class="ts" x="326" y="401" dominant-baseline="central">Batch 집계 흐름</text>
  <line x1="420" y1="401" x2="442" y2="401" stroke="#534AB7" stroke-width="0.8"/>
  <text class="ts" x="446" y="401" dominant-baseline="central">JPA 연관관계</text>
</svg>
