spring:
  application:
    name: ecommerce-batch
  datasource:
    url: jdbc:mysql://localhost:13306/ecommerce?serverTimezone=UTC&characterEncoding=UTF-8
    username: local
    password: local
    driver-class-name: com.mysql.cj.jdbc.Driver
  batch:
    jdbc:
      initialize-schema: always
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_updates: true
        order_inserts: true

logging:
  level:
    root: INFO
#    org.springframework.jdbc.core.JdbcTemplate: DEBUG
#    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
prometheus:
  job:
    name: spring-batch
  pushgateway:
    url: localhost:9091