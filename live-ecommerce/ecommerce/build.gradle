plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'     // 웹이면
    implementation 'org.springframework.boot:spring-boot-starter-aop'     // AopConfig 있으면
    implementation 'org.springframework.boot:spring-boot-starter-cache'   // CacheConfig 있으면

    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    api 'org.springframework.boot:spring-boot-starter-data-redis'


    implementation 'org.springframework.boot:spring-boot-testcontainers' // 스프링 부트 3.1+ 권장
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:mongodb' // (선택) GenericContainer 대신 MongoDBContainer 사용 시


    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 필요시 모듈 의존
     implementation project(':common')
    // implementation project(':payment')
}
